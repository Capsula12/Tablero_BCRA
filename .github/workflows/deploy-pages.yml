name: Deploy GitHub Pages

# Publica la versión web estática del Tablero BCRA en GitHub Pages.
# Sirve los HTML del repo (index.html, panel.html, series.html, calc.html),
# /assets y /data. No hay build step: el sitio es 100% estático.

on:
  push:
    branches:
      # La branch canónica que sirve GitHub Pages es HTML.
      # main se mantiene como espejo opcional; igual lo dejamos como trigger para
      # cubrir el caso donde el sync script empuja a main por error.
      - HTML
      - main
    paths:
      - "index.html"
      - "panel.html"
      - "series.html"
      - "calc.html"
      - "ranking.html"
      - "assets/**"
      - "data/**"
      - ".github/workflows/deploy-pages.yml"
      - ".nojekyll"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          # Servimos toda la raíz del repo. El .nojekyll evita el procesamiento de Jekyll.
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
