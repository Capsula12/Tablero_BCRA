<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sucursales y dependencias — Tablero BCRA</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/sucursales.css">

  <!-- Leaflet (mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='url(%23g)'/><text x='32' y='44' text-anchor='middle' font-family='Arial' font-weight='800' font-size='34' fill='white'>B</text><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236fa8ff'/><stop offset='1' stop-color='%23c084fc'/></linearGradient></defs></svg>">
</head>
<body>
  <div class="app-shell">
    <div id="topbar-host"></div>

    <div class="container">
      <header class="page-header">
        <div>
          <h1 class="page-title">Sucursales y dependencias</h1>
          <p class="page-subtitle">Red de atención de cada banco: sucursales, cajeros fuera de casas operativas, terminales de autoservicio y dependencias automatizadas.</p>
        </div>
        <div id="suc-meta" class="muted small"></div>
      </header>

      <div class="card padded mb-12">
        <div class="filters">
          <div class="f-6">
            <label class="field-label">Entidad</label>
            <div id="entity-picker"></div>
          </div>
          <div class="f-6">
            <label class="field-label">Mes (snapshot del mapa y resumen)</label>
            <div id="month-picker"></div>
          </div>
        </div>
        <div class="muted small mt-8" id="map-month-note"></div>
      </div>

      <div id="suc-status" class="notice info hidden"></div>

      <!-- Mapa -->
      <div class="card padded mb-12">
        <div class="card-header" style="border:none;padding:0;margin-bottom:10px">
          <h3 class="card-title" style="margin:0">Mapa</h3>
          <div id="map-mode-toggle"></div>
        </div>
        <div class="suc-map-wrap">
          <!-- Mapa Leaflet (puntos) -->
          <div id="suc-map" class="map-hidden-when-other"></div>
          <!-- Mapa choropleth Plotly (distribución por provincia) -->
          <div id="suc-choropleth" class="map-hidden-when-other"></div>
        </div>
        <!-- Referencias del mapa interactivo: viven AFUERA del mapa para no
             interferir con la interacción (click/hover/zoom de Leaflet) y
             solo se muestran en modo "Mapa interactivo". -->
        <div class="map-legend" id="map-legend" hidden></div>
        <div class="muted small mt-8" id="map-foot-note"></div>
      </div>

      <!-- Resumen tipo Panel -->
      <div class="panel-grid" id="suc-kpis"></div>

      <!-- Distribución por provincia / partido -->
      <div class="card mt-24">
        <div class="card-header">
          <h3 class="card-title">Distribución por provincia</h3>
          <div id="dist-toggle"></div>
        </div>
        <div class="card-body">
          <div id="dist-chart" class="plotly-host" style="height:520px"></div>
        </div>
      </div>

      <!-- Evolución mensual -->
      <div class="card mt-24">
        <div class="card-header">
          <h3 class="card-title">Evolución mensual</h3>
          <label class="checkbox" title="Indexa cada serie a 100 en su primer mes válido, para comparar variaciones de entidades con escalas distintas">
            <input type="checkbox" id="ts-compare">
            <span>Comparar (índice 100 en el primer mes)</span>
          </label>
        </div>
        <div class="card-body">
          <div class="filters">
            <div class="f-6">
              <label class="field-label">Período</label>
              <div id="ts-range"></div>
            </div>
            <div class="f-6">
              <label class="field-label">Entidades</label>
              <div id="ts-entities"></div>
            </div>
            <div class="f-12">
              <label class="field-label">Categorías</label>
              <div id="ts-cats"></div>
            </div>
          </div>
          <div id="ts-chart" class="plotly-host" style="height:480px;margin-top:14px"></div>
        </div>
      </div>
    </div>

    <div id="footer-host"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/casas.js"></script>
  <script src="assets/js/sucursales.js"></script>
</body>
</html>
