<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora — Tablero BCRA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='url(%23g)'/><text x='32' y='44' text-anchor='middle' font-family='Arial' font-weight='800' font-size='34' fill='white'>B</text><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%230E9E74'/><stop offset='1' stop-color='%23123C6B'/></linearGradient></defs></svg>">
</head>
<body>
  <div class="app-shell">
    <div id="topbar-host"></div>

    <div class="container">
      <header class="page-header">
        <div>
          <h1 class="page-title">Calculadora</h1>
          <p class="page-subtitle">Construí fórmulas combinando indicadores con paréntesis y operadores. Graficamos el resultado por entidad.</p>
        </div>
        <div id="calc-meta" class="muted small"></div>
      </header>

      <div class="card padded mb-12">
        <div class="filters">
          <div class="f-6">
            <label class="field-label">Período</label>
            <div id="range-picker"></div>
          </div>
          <div class="f-6">
            <label class="field-label">Entidades</label>
            <div id="entities-picker"></div>
          </div>
        </div>
      </div>

      <div class="card padded mb-12">
        <div class="flex items-center justify-between mb-12">
          <h3 class="card-title" style="margin:0">Fórmula</h3>
          <div class="flex gap-8">
            <button class="btn" id="add-row">+ Variable</button>
            <button class="btn ghost" id="clear-rows">Limpiar</button>
          </div>
        </div>

        <div class="muted small mb-12">
          Cada fila es una variable. Elegí los paréntesis (opcionales — los sueltos se ignoran), operador y el indicador.
        </div>

        <div id="rows" class="calc-builder"></div>

        <div class="formula-display" id="formula-display">Sin fórmula.</div>
      </div>

      <div id="calc-status" class="notice info hidden"></div>

      <div id="calc-chart-card" class="card mb-12" hidden>
        <div class="card-header">
          <h3 class="card-title">Resultado</h3>
        </div>
        <div class="card-body">
          <div id="calc-chart" class="plotly-host" style="height:420px"></div>
        </div>
      </div>

      <div class="card mt-24" id="data-table-card" hidden>
        <div class="card-header">
          <h3 class="card-title">Datos</h3>
          <button class="btn ghost" id="download-csv">Descargar CSV</button>
        </div>
        <div class="card-body" style="padding:0">
          <div class="table-wrap" style="max-height:400px">
            <table class="data" id="data-table"></table>
          </div>
        </div>
      </div>
    </div>

    <div id="footer-host"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/calc.js"></script>
</body>
</html>
